<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07050e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Organizer">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Organizer</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="seitenleiste" id="leiste">
      <div class="marke"><span class="logo"></span><b>Organizer</b></div>
      <nav id="navi"></nav>
      <div class="leiste-unten">
        <button class="konto" id="konto"></button>
      </div>
    </aside>

    <main class="haupt">
      <header class="kopf">
        <div class="links"><small>O.R.G.A.N.I.Z.E.R · KXD Command Center</small><h1 id="titel">Heute</h1></div>
        <div class="rechts">
          <div class="status"><b id="status-titel">Phoenix Link Active</b><small id="status-unter">All Systems Nominal</small></div>
          <span class="uhr-gross" id="uhr"></span>
          <label class="suche"><span id="lupe"></span><input id="suche" type="search" placeholder="Suchen"></label>
        </div>
      </header>
      <div class="schnell panel" id="schnell">
        <div class="art-wahl" id="art-wahl"></div>
        <div class="schnell-zeile">
          <input id="neu-text" placeholder="Neue Idee …" autocomplete="off" enterkeyhint="done">
          <input id="neu-datum" type="datetime-local" title="Datum / Uhrzeit (optional)">
          <button class="mikro" id="mikro" title="Diktieren"></button>
          <button class="hinzu" id="hinzu" title="Hinzufügen"></button>
        </div>
      </div>
      <div class="filter" id="filter"></div>
      <section id="inhalt" class="inhalt"></section>
    </main>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="blatt" id="blatt" hidden><div class="blatt-hinter"></div><div class="blatt-box" id="blatt-box"></div></div>
  <div class="hinweis" id="hinweis" hidden></div>

  <script src="config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
